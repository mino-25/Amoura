<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Apache/mod_php ne transmet pas l'en-tête Authorization à PHP par défaut
    # (absent de $_SERVER, visible seulement via apache_request_headers()).
    # Nécessaire pour que LexikJWTAuthenticationBundle lise le token Bearer.
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    <Directory /var/www/html/public>
        AllowOverride None
        Order Allow,Deny
        Allow from All

        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: amoura_test
          MARIADB_USER: amoura
          MARIADB_PASSWORD: amoura_test
          MARIADB_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mysqli, intl, zip, opcache
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Generate JWT keypair for tests
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction
        env:
          APP_ENV: test
          # Nom de base "amoura" (sans suffixe) : config/packages/doctrine.yaml ajoute
          # automatiquement "_test" en environnement test, ce qui cible la base
          # "amoura_test" réellement créée par le service mariadb ci-dessus.
          DATABASE_URL: mysql://amoura:amoura_test@127.0.0.1:3306/amoura?serverVersion=10.11.2-MariaDB&charset=utf8mb4

      - name: Tests unitaires et fonctionnels (PHPUnit)
        run: vendor/bin/phpunit
        env:
          APP_ENV: test
          # Nom de base "amoura" (sans suffixe) : config/packages/doctrine.yaml ajoute
          # automatiquement "_test" en environnement test, ce qui cible la base
          # "amoura_test" réellement créée par le service mariadb ci-dessus.
          DATABASE_URL: mysql://amoura:amoura_test@127.0.0.1:3306/amoura?serverVersion=10.11.2-MariaDB&charset=utf8mb4

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint JS (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t amoura-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t amoura-frontend:ci --target production ./frontend
